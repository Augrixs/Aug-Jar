name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npx cap add android
      - run: python3 scripts/patch_android.py
        env:
          RUN_NUMBER: ${{ github.run_number }}
      - run: npx cap sync android
      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DailyJar-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK to the 'latest' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk DailyJar.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Daily Jar (latest APK)" --notes "Latest Android build of Daily Jar."
          gh release upload latest DailyJar.apk --clobber
